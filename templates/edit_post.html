<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Edit Post</title>
  </head>
  <body>
    <h1>Edit Post</h1>
    {% if error %}
      <p style="color:red">{{ error }}</p>
    {% endif %}
    <form method="post" action="/posts/{{ post.id }}/edit">
      <textarea name="body" rows="3" cols="40" required>{{ post.body }}</textarea><br>
      <button type="submit">Save</button>
    </form>
    <p><a href="/feed">Back to feed</a></p>
  </body>
</html>
